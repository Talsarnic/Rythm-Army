<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rhythm Army</title>
<style>
  html, body { margin: 0; height: 100%; background: #16101f; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
<canvas id="game"></canvas>
<script>
// Core rhythm logic. Pure (no DOM, no audio) so it can be unit tested.
// All times are in seconds on one shared clock (the audio clock in the browser).

const DRUMS = [
  { id: 0, name: 'BOOM', color: '#e4572e', keys: ['a', 'j'] },
  { id: 1, name: 'TAK', color: '#f2b134', keys: ['s', 'k'] },
  { id: 2, name: 'RAT', color: '#3fa7d6', keys: ['d', 'l'] },
  { id: 3, name: 'TING', color: '#59cd90', keys: ['f', ';'] },
];

// Command patterns, same drum sequences as Patapon 1 (plus Jump from Patapon 2).
// Drum mapping: Pata = TAK (1), Pon = BOOM (0), Don = RAT (2), Chaka = TING (3).
// Left out on purpose for now: Wake (intro-only), Cure (needs status effects like burn/freeze/dizzy)
// and Miracle (needs half-beat input and Fever). All three are planned for later.
const COMMANDS = [
  { id: 'march', name: 'MARCH', pattern: [1, 1, 1, 0] }, // Pata Pata Pata Pon
  { id: 'attack', name: 'ATTACK', pattern: [0, 0, 1, 0] }, // Pon Pon Pata Pon
  { id: 'defend', name: 'DEFEND', pattern: [3, 3, 1, 0] }, // Chaka Chaka Pata Pon
  { id: 'retreat', name: 'RETREAT', pattern: [0, 1, 0, 1] }, // Pon Pata Pon Pata
  { id: 'charge', name: 'CHARGE', pattern: [0, 0, 3, 3] }, // Pon Pon Chaka Chaka
  { id: 'jump', name: 'JUMP', pattern: [2, 2, 3, 3] }, // Don Don Chaka Chaka (Patapon 2)
];

const INPUT_BEATS = 4; // beats where the player drums
const MEASURE_BEATS = 8; // 4 input beats + 4 army-response beats
const FEVER_COMBO = 8;

class RhythmEngine {
  constructor(opts = {}) {
    this.bpm = opts.bpm ?? 120;
    this.startTime = opts.startTime ?? 0;
    this.inputOffsetMs = opts.inputOffsetMs ?? 0;
    this.perfectMs = opts.perfectMs ?? 60;
    this.goodMs = opts.goodMs ?? 120;
    this.commands = opts.commands ?? COMMANDS;
    this.beatLength = 60 / this.bpm;
    this.slots = new Map(); // measure index -> array of INPUT_BEATS judged taps
    this.nextBeat = 0;
    this.nextMeasure = 0;
    this.combo = 0;
    this.bestCombo = 0;
  }

  get fever() {
    return this.combo >= FEVER_COMBO;
  }

  beatTime(n) {
    return this.startTime + n * this.beatLength;
  }

  // Beat position as a float (0 at startTime, 1 one beat later).
  beatPosition(time) {
    return (time - this.startTime) / this.beatLength;
  }

  judgeTap(drum, time) {
    const adjusted = time - this.inputOffsetMs / 1000;
    const beat = Math.round((adjusted - this.startTime) / this.beatLength);
    const deltaMs = (adjusted - this.beatTime(beat)) * 1000; // + means late
    const abs = Math.abs(deltaMs);
    const grade = abs <= this.perfectMs ? 'perfect' : abs <= this.goodMs ? 'good' : 'miss';
    return { drum, beat, deltaMs, grade };
  }

  // Register a player tap. Returns the judgement; `ignored` is set when the tap
  // fell outside the input phase (during the army's response beats or before the start).
  tap(drum, time) {
    const j = this.judgeTap(drum, time);
    if (j.beat < 0) return { ...j, ignored: true };
    const measure = Math.floor(j.beat / MEASURE_BEATS);
    const slot = j.beat % MEASURE_BEATS;
    if (slot >= INPUT_BEATS) return { ...j, ignored: true };
    if (j.grade === 'miss') {
      this.combo = 0;
      return { ...j, measure, slot, ignored: false };
    }
    let row = this.slots.get(measure);
    if (!row) {
      row = new Array(INPUT_BEATS).fill(null);
      this.slots.set(measure, row);
    }
    const existing = row[slot];
    if (!existing || Math.abs(j.deltaMs) < Math.abs(existing.deltaMs)) row[slot] = j;
    this.combo += 1;
    this.bestCombo = Math.max(this.bestCombo, this.combo);
    return { ...j, measure, slot, ignored: false };
  }

  // Advance to `time`. Returns events: {type:'beat'}, {type:'command'}, {type:'fail'}.
  advance(time) {
    const events = [];
    while (this.beatTime(this.nextBeat) <= time) {
      const beat = this.nextBeat++;
      const slot = beat % MEASURE_BEATS;
      events.push({
        type: 'beat',
        beat,
        measure: Math.floor(beat / MEASURE_BEATS),
        slot,
        phase: slot < INPUT_BEATS ? 'input' : 'response',
      });
    }
    // The measure is judged shortly after the last input beat so a late final tap still counts.
    const grace = this.goodMs / 1000 + Math.max(0, this.inputOffsetMs) / 1000;
    while (this.beatTime(this.nextMeasure * MEASURE_BEATS + INPUT_BEATS) + grace <= time) {
      const m = this.nextMeasure++;
      const ev = this.evaluate(m);
      if (ev) events.push(ev);
    }
    return events;
  }

  evaluate(measure) {
    const row = this.slots.get(measure);
    this.slots.delete(measure);
    const beat = measure * MEASURE_BEATS + INPUT_BEATS;
    if (!row) return null; // player rested this measure
    if (row.some((s) => s === null)) {
      this.combo = 0;
      return { type: 'fail', reason: 'incomplete', measure, beat };
    }
    const drums = row.map((s) => s.drum);
    const command = this.commands.find((c) => c.pattern.every((d, i) => d === drums[i]));
    if (!command) {
      this.combo = 0;
      return { type: 'fail', reason: 'unknown', measure, beat };
    }
    const perfects = row.filter((s) => s.grade === 'perfect').length;
    return { type: 'command', command, measure, beat, perfects, fever: this.fever };
  }
}

// Input-latency calibration: median of tap offsets (ms, + means late), ignoring wild outliers.
function computeOffset(deltasMs) {
  const usable = deltasMs.filter((d) => Math.abs(d) <= 250).sort((a, b) => a - b);
  if (usable.length < 4) return null;
  const mid = Math.floor(usable.length / 2);
  const median = usable.length % 2 ? usable[mid] : (usable[mid - 1] + usable[mid]) / 2;
  return Math.round(median);
}

// Web Audio helpers: synthesized drums and click track. No audio files needed.

class AudioEngine {
  constructor() {
    this.ctx = null;
  }

  async unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: 'interactive' });
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.5);
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state !== 'running') await this.ctx.resume();
  }

  now() {
    return this.ctx.currentTime;
  }

  // Convert a DOM event timestamp (performance.now() timebase) to audio-clock time.
  eventTimeToAudio(domTimestamp) {
    let age = (performance.now() - domTimestamp) / 1000;
    if (!(age >= 0 && age < 1)) age = 0; // guard against odd timestamp bases
    return this.ctx.currentTime - age;
  }

  env(when, peak, decay) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
    g.connect(this.master);
    return g;
  }

  tone(type, f0, f1, when, peak, decay) {
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, when);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, when + decay * 0.7);
    o.connect(this.env(when, peak, decay));
    o.start(when);
    o.stop(when + decay + 0.05);
  }

  burst(freq, q, when, peak, decay) {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    s.connect(f);
    f.connect(this.env(when, peak, decay));
    s.start(when);
    s.stop(when + decay + 0.05);
  }

  drum(id, when = this.ctx.currentTime) {
    if (id === 0) this.tone('sine', 150, 45, when, 0.95, 0.32); // BOOM
    else if (id === 1) { this.burst(1800, 1.2, when, 0.7, 0.1); this.tone('sine', 230, 200, when, 0.25, 0.08); } // TAK
    else if (id === 2) { this.tone('triangle', 340, 250, when, 0.6, 0.16); this.burst(3200, 2, when, 0.18, 0.05); } // RAT
    else this.tone('sine', 880, 880, when, 0.35, 0.4), this.tone('sine', 1320, 1320, when, 0.18, 0.3); // TING
  }

  tick(when, accent = false) {
    this.tone('square', accent ? 1500 : 1000, accent ? 1500 : 1000, when, accent ? 0.12 : 0.06, 0.04);
  }

  thump(when) {
    this.tone('sine', 90, 55, when, 0.22, 0.14);
  }
}




const canvas = document.getElementById('game');
const g = canvas.getContext('2d');
const audio = new AudioEngine();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const state = {
  scene: 'title',
  offsetMs: store.get('offsetMs', 0),
  play: null,
  cal: null,
  pressed: [0, 0, 0, 0],
  pops: [],
};

// ---------- layout ----------
const padH = () => Math.max(96, Math.min(170, H * 0.27));
const areaH = () => H - padH();
function padRect(i) {
  const gap = 8, w = (W - gap * 5) / 4;
  return { x: gap + i * (w + gap), y: areaH() + gap, w, h: padH() - gap * 2 };
}
function padAt(x, y) {
  if (y < areaH()) return -1;
  for (let i = 0; i < 4; i++) { const r = padRect(i); if (x >= r.x && x <= r.x + r.w) return i; }
  return -1;
}
function titleButtons() {
  const w = Math.min(280, W - 48), h = 56, x = (W - w) / 2, y0 = H * 0.42;
  return [
    { label: 'PLAY', act: startPlay, x, y: y0, w, h },
    { label: 'CALIBRATE TIMING', act: startCalibrate, x, y: y0 + h + 14, w, h },
  ];
}

// ---------- scenes ----------
async function startPlay() {
  await audio.unlock();
  const engine = new RhythmEngine({ bpm: 120, startTime: audio.now() + 1.2, inputOffsetMs: state.offsetMs });
  state.play = {
    engine, nextTick: 0, scroll: 0, action: null, flash: 0, feverT: 0, pulse: 0,
    msg: null, lastGrade: null, hitCount: 0, failCount: 0, commandsDone: 0,
  };
  state.pops.length = 0;
  state.scene = 'play';
}

async function startCalibrate() {
  await audio.unlock();
  const bpm = 100, beats = 12, start = audio.now() + 1.2, len = 60 / bpm;
  for (let i = 0; i < beats; i++) audio.tick(start + i * len, i % 4 === 0);
  state.cal = { start, beats, len, deltas: [], done: false, result: null, flash: 0 };
  state.scene = 'calibrate';
}

function toTitle() { state.scene = 'title'; }

// ---------- input ----------
function onDrum(drum, time) {
  const p = state.play;
  state.pressed[drum] = performance.now() + 120;
  audio.drum(drum);
  const j = p.engine.tap(drum, time);
  if (j.ignored) return;
  const label = j.grade === 'perfect' ? 'PERFECT' : j.grade === 'good' ? 'GOOD' : 'MISS';
  const color = j.grade === 'perfect' ? '#59cd90' : j.grade === 'good' ? '#f2b134' : '#e4572e';
  const ms = (j.deltaMs >= 0 ? '+' : '') + Math.round(j.deltaMs) + 'ms';
  state.pops.push({ text: label, sub: ms, color, x: padRect(drum).x + padRect(drum).w / 2, t0: performance.now() });
}

function onCalTap(time) {
  const c = state.cal;
  if (c.done) {
    if (c.result !== null) { state.offsetMs = c.result; store.set('offsetMs', c.result); }
    toTitle();
    return;
  }
  c.flash = performance.now();
  const n = Math.round((time - c.start) / c.len);
  if (n >= 2 && n < c.beats) c.deltas.push((time - (c.start + n * c.len)) * 1000);
}

function handleInput(drum, x, y, domTimestamp) {
  if (state.scene === 'title') return;
  const t = audio.eventTimeToAudio(domTimestamp);
  if (state.scene === 'play') { if (drum >= 0) onDrum(drum, t); }
  else if (state.scene === 'calibrate') onCalTap(t);
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if (state.scene === 'title') {
    for (const b of titleButtons()) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) b.act();
    return;
  }
  handleInput(padAt(x, y), x, y, e.timeStamp);
});
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { toTitle(); return; }
  if (state.scene === 'title') { if (k === 'enter') startPlay(); else if (k === 'c') startCalibrate(); return; }
  const drum = DRUMS.findIndex((d) => d.keys.includes(k));
  if (state.scene === 'play' && drum < 0) return;
  if (drum >= 0 || state.scene === 'calibrate') { e.preventDefault(); handleInput(drum, 0, 0, e.timeStamp); }
});
window.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- drawing helpers ----------
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

function hills(color, base, amp, freq, scroll, speed) {
  g.fillStyle = color;
  g.beginPath(); g.moveTo(0, areaH());
  for (let x = 0; x <= W + 8; x += 8) {
    const s = (x + scroll * speed) * freq;
    g.lineTo(x, base - (Math.sin(s) * amp + Math.sin(s * 2.3 + 1) * amp * 0.4));
  }
  g.lineTo(W, areaH()); g.closePath(); g.fill();
}

function drawUnit(x, y, s, o) {
  g.save(); g.translate(x, y - o.jump); g.scale(s, s);
  g.fillStyle = '#16121f'; g.strokeStyle = '#16121f'; g.lineWidth = 4; g.lineCap = 'round';
  const swing = o.walk ? Math.sin(o.t * 9 + o.phase) * 7 : 0;
  g.fillRect(-9 + swing, -10, 7, 10); g.fillRect(2 - swing, -10, 7, 10); // legs
  g.beginPath(); g.roundRect(-13, -42 + o.bob, 26, 34, 8); g.fill(); // body
  g.beginPath(); g.arc(0, -54 + o.bob, 14, 0, Math.PI * 2); g.fill(); // head
  g.fillStyle = '#e9e3d4'; // eyes
  g.beginPath(); g.arc(-5, -55 + o.bob, 3.4, 0, Math.PI * 2); g.arc(5, -55 + o.bob, 3.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#16121f'; g.fillRect(-4, -75 + o.bob, 8, 10); // helmet crest
  g.beginPath(); g.moveTo(10, -30 + o.bob); g.lineTo(54 + o.lunge, -34 + o.bob - o.lunge * 0.1); g.stroke(); // spear
  g.beginPath(); g.moveTo(54 + o.lunge, -34 + o.bob - o.lunge * 0.1); g.lineTo(64 + o.lunge, -36 + o.bob - o.lunge * 0.1); g.lineTo(54 + o.lunge, -28 + o.bob - o.lunge * 0.1); g.fill(); // tip
  if (o.defend) { g.beginPath(); g.arc(16, -30 + o.bob, 20, -Math.PI / 2, Math.PI / 2); g.lineWidth = 6; g.stroke(); }
  g.restore();
}

const ACTION = {
  march: { speed: 150, walk: true }, attack: { speed: 0, lunge: true }, defend: { speed: 0, defend: true },
  charge: { speed: 340, walk: true, lunge: true }, retreat: { speed: -130, walk: true }, jump: { speed: 0, jump: true },
};

function drawScene(p, now, dt) {
  const e = p.engine;
  const beatPos = e.beatPosition(now);
  const frac = beatPos - Math.floor(beatPos);
  const target = e.fever ? 1 : 0;
  p.feverT += (target - p.feverT) * Math.min(1, dt * 3);
  const topC = mix([34, 24, 58], [96, 18, 52], p.feverT), botC = mix([240, 138, 75], [255, 207, 74], p.feverT);
  const sky = g.createLinearGradient(0, 0, 0, areaH());
  sky.addColorStop(0, rgb(topC)); sky.addColorStop(1, rgb(botC));
  g.fillStyle = sky; g.fillRect(0, 0, W, areaH());

  const pulse = beatPos >= 0 ? Math.exp(-frac * 5) : 0;
  g.fillStyle = `rgba(255,236,170,${0.85 + p.feverT * 0.15})`;
  g.beginPath(); g.arc(W >= 720 ? W * 0.6 : W * 0.78, areaH() * 0.3, areaH() * (0.09 + pulse * 0.012 + p.feverT * 0.03), 0, Math.PI * 2); g.fill();

  hills(rgb(mix([90, 52, 98], [150, 40, 80], p.feverT)), areaH() * 0.62, areaH() * 0.1, 0.006, p.scroll, 0.15);
  hills(rgb(mix([58, 34, 76], [110, 28, 62], p.feverT)), areaH() * 0.72, areaH() * 0.08, 0.009, p.scroll, 0.4);
  const groundY = areaH() * 0.82;
  g.fillStyle = '#1b1426'; g.fillRect(0, groundY, W, areaH() - groundY);
  g.fillStyle = '#2c2040';
  for (let x = -((p.scroll * 1) % 60); x < W; x += 60) g.fillRect(x, groundY + 8, 28, 3);

  const act = p.action ? ACTION[p.action.id] : null;
  const s = Math.max(0.6, Math.min(1.5, Math.min(W / 800, areaH() / 420)));
  const idleBeat = beatPos >= 0 ? Math.exp(-frac * 6) : 0;
  const hop = act?.jump ? Math.abs(Math.sin(Math.min(1, (beatPos - p.action.beat) / 4) * Math.PI * 2)) * 70 : 0;
  const thrust = act?.lunge ? Math.max(0, Math.sin(frac * Math.PI)) * 22 : 0;
  for (let i = 0; i < 5; i++) {
    const x = W * 0.12 + i * 60 * s + (act?.speed < 0 ? -10 : 0);
    const uy = groundY + 6 + (i % 2) * 6;
    drawUnit(x, uy, s, {
      t: now, phase: i * 0.8, bob: -idleBeat * 5, walk: !!act?.walk, lunge: thrust, defend: !!act?.defend, jump: hop,
    });
  }
}

function drawHud(p, now) {
  const e = p.engine;
  const beatPos = e.beatPosition(now);
  const n = Math.floor(beatPos);
  const slotNow = beatPos >= 0 ? ((n % MEASURE_BEATS) + MEASURE_BEATS) % MEASURE_BEATS : -1;
  const dot = Math.min(16, W / 24), gap = dot * 0.7, total = 8 * dot + 7 * gap + dot;
  let x = (W - total) / 2;
  const ry = W < 520 ? 84 : 28; // on narrow screens the dots sit below the combo counter
  g.font = `700 ${Math.max(10, dot * 0.7)}px system-ui, sans-serif`; g.textAlign = 'center';
  for (let i = 0; i < 8; i++) {
    if (i === INPUT_BEATS) x += dot;
    const on = i === slotNow;
    g.fillStyle = i < INPUT_BEATS ? (on ? '#fff' : 'rgba(255,255,255,0.35)') : (on ? '#59cd90' : 'rgba(89,205,144,0.35)');
    g.beginPath(); g.arc(x + dot / 2, ry, on ? dot * 0.62 : dot * 0.42, 0, Math.PI * 2); g.fill();
    x += dot + gap;
  }
  g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillText('DRUM', W / 2 - total / 4, ry + 30); g.fillText('ARMY', W / 2 + total / 4, ry + 30);

  g.textAlign = 'left'; g.font = '700 18px system-ui, sans-serif'; g.fillStyle = '#fff';
  g.fillText(`COMBO ${e.combo}`, 16, 32);
  g.font = '12px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.75)';
  g.fillText(`offset ${state.offsetMs >= 0 ? '+' : ''}${state.offsetMs}ms`, 16, 50);
  if (e.fever) { g.fillStyle = '#ffe9a8'; g.font = '800 20px system-ui, sans-serif'; g.fillText('FEVER!', 16, 76); }

  if (W >= 720) { // command cheat-sheet
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    const lines = COMMANDS.map((c) => `${c.name.padEnd(8)} ${c.pattern.map((d) => DRUMS[d].name).join(' ')}`);
    const boxW = Math.max(...lines.map((l) => g.measureText(l).width)) + 20, bx = W - 16 - boxW;
    g.fillStyle = 'rgba(10,6,18,0.45)'; g.beginPath(); g.roundRect(bx, 12, boxW, lines.length * 18 + 12, 8); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    lines.forEach((l, i) => g.fillText(l, bx + 10, 32 + i * 18));
  }

  if (p.msg && performance.now() - p.msg.t0 < 1400) {
    const a = 1 - (performance.now() - p.msg.t0) / 1400;
    g.globalAlpha = Math.max(0, Math.min(1, a * 1.6));
    g.textAlign = 'center'; g.fillStyle = p.msg.color; g.font = `800 ${Math.min(56, W / 9)}px system-ui, sans-serif`;
    g.fillText(p.msg.text, W / 2, areaH() * 0.38); g.globalAlpha = 1;
  }
  if (beatPos < 0) {
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '700 22px system-ui, sans-serif';
    g.fillText('Get ready. Drum on the first four beats, the army moves on the next four.', W / 2, areaH() * 0.5);
  }
}

function drawPads() {
  const nowMs = performance.now();
  g.fillStyle = '#0f0b17'; g.fillRect(0, areaH(), W, padH());
  for (let i = 0; i < 4; i++) {
    const r = padRect(i), lit = state.pressed[i] > nowMs;
    g.fillStyle = lit ? DRUMS[i].color : '#241b33';
    g.strokeStyle = DRUMS[i].color; g.lineWidth = 3;
    g.beginPath(); g.roundRect(r.x, r.y, r.w, r.h, 14); g.fill(); g.stroke();
    g.fillStyle = lit ? '#fff' : DRUMS[i].color; g.textAlign = 'center';
    g.font = `800 ${Math.min(28, r.w / 4)}px system-ui, sans-serif`; g.fillText(DRUMS[i].name, r.x + r.w / 2, r.y + r.h / 2 + 8);
    g.font = '12px ui-monospace, monospace'; g.fillStyle = 'rgba(255,255,255,0.55)';
    g.fillText(DRUMS[i].keys.join(' / ').toUpperCase(), r.x + r.w / 2, r.y + r.h - 12);
  }
  for (const pop of state.pops) {
    const age = nowMs - pop.t0; if (age > 700) continue;
    g.globalAlpha = 1 - age / 700; g.textAlign = 'center'; g.fillStyle = pop.color;
    g.font = '800 18px system-ui, sans-serif'; g.fillText(pop.text, pop.x, areaH() - 26 - age * 0.05);
    g.font = '11px ui-monospace, monospace'; g.fillText(pop.sub, pop.x, areaH() - 10 - age * 0.05); g.globalAlpha = 1;
  }
  state.pops = state.pops.filter((p) => nowMs - p.t0 <= 700);
}

// ---------- scene loops ----------
function updatePlay(dt) {
  const p = state.play, e = p.engine, now = audio.now();
  while (e.beatTime(p.nextTick) < now + 0.2) { // schedule click track ahead of time
    const slot = p.nextTick % MEASURE_BEATS, when = e.beatTime(p.nextTick);
    if (slot < INPUT_BEATS) audio.tick(when, slot === 0); else audio.thump(when);
    p.nextTick++;
  }
  for (const ev of e.advance(now)) {
    if (ev.type === 'command') {
      p.action = { id: ev.command.id, beat: ev.beat };
      p.msg = { text: ev.command.name + (ev.fever ? ' (FEVER)' : ''), color: '#fff', t0: performance.now() };
      p.commandsDone++;
    } else if (ev.type === 'fail') {
      p.action = null;
      p.msg = { text: ev.reason === 'unknown' ? 'UNKNOWN BEAT' : 'MISSED BEAT', color: '#ff8a6b', t0: performance.now() };
    }
  }
  if (p.action && e.beatPosition(now) >= p.action.beat + INPUT_BEATS) p.action = null;
  const act = p.action ? ACTION[p.action.id] : null;
  p.scroll += (act?.speed ?? 0) * (e.fever ? 1.3 : 1) * dt;
  drawScene(p, now, dt);
  drawHud(p, now);
  drawPads();
}

function drawTitle() {
  g.fillStyle = '#16101f'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = `800 ${Math.min(52, W / 9)}px system-ui, sans-serif`;
  g.fillText('RHYTHM ARMY', W / 2, H * 0.2);
  g.font = '14px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.65)';
  g.fillText('working title  -  Phase 1 rhythm prototype', W / 2, H * 0.2 + 28);
  g.font = '15px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.85)';
  g.fillText('Drum four beats. Your army acts on the next four.', W / 2, H * 0.34);
  g.fillText('Keys: A S D F  (or J K L ;)   -   Touch: tap the pads', W / 2, H * 0.34 + 24);
  for (const b of titleButtons()) {
    g.fillStyle = '#e4572e'; g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 12); g.fill();
    g.fillStyle = '#fff'; g.font = '800 17px system-ui, sans-serif'; g.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 6);
  }
  const by = H * 0.42 + 56 * 2 + 14; // bottom of the buttons
  g.font = '12px ui-monospace, monospace'; g.fillStyle = 'rgba(255,255,255,0.55)';
  g.fillText(`input offset ${state.offsetMs >= 0 ? '+' : ''}${state.offsetMs}ms (calibrate if hits feel early or late)`, W / 2, by + 32);
  if (W >= 640 && H >= 440) { // command list in two columns
    g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,0.8)';
    COMMANDS.forEach((c, i) => {
      const col = Math.floor(i / 4), row = i % 4;
      g.fillText(`${c.name.padEnd(8)} ${c.pattern.map((d) => DRUMS[d].name).join(' ')}`, W / 2 - 250 + col * 270, by + 66 + row * 18);
    });
  }
}

function drawCalibrate() {
  const c = state.cal, now = audio.now();
  g.fillStyle = '#16101f'; g.fillRect(0, 0, W, H); g.textAlign = 'center'; g.fillStyle = '#fff';
  const beatPos = (now - c.start) / c.len, frac = beatPos - Math.floor(beatPos);
  if (!c.done && now > c.start + c.beats * c.len + 0.5) { c.done = true; c.result = computeOffset(c.deltas); }
  const r = 50 + (beatPos >= 0 && beatPos < c.beats ? Math.exp(-frac * 6) * 30 : 0);
  g.fillStyle = performance.now() - c.flash < 90 ? '#59cd90' : '#e4572e';
  g.beginPath(); g.arc(W / 2, H * 0.4, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = '700 20px system-ui, sans-serif';
  if (!c.done) {
    g.fillText('Tap anywhere (or press any drum key) exactly on each click.', W / 2, H * 0.62);
    g.font = '14px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.7)';
    g.fillText(`${c.deltas.length} taps counted. Ignore the first two clicks.`, W / 2, H * 0.62 + 28);
  } else if (c.result === null) {
    g.fillText('Not enough taps. Tap to try the screen again.', W / 2, H * 0.62);
    c.retry = true;
  } else {
    g.fillText(`Your offset: ${c.result >= 0 ? '+' : ''}${c.result} ms`, W / 2, H * 0.62);
    g.font = '14px system-ui, sans-serif'; g.fillStyle = 'rgba(255,255,255,0.7)';
    g.fillText('Tap to save and go back.', W / 2, H * 0.62 + 28);
  }
}

let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  g.clearRect(0, 0, W, H);
  if (state.scene === 'title') drawTitle();
  else if (state.scene === 'calibrate') drawCalibrate();
  else updatePlay(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = { state, audio }; // handy for debugging and automated checks

</script>
